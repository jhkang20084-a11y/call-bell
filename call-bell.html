<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>교무실 호출벨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12161d;
    --surface: #1a2029;
    --surface-raised: #222a37;
    --border: #2a3140;
    --text: #eef1f6;
    --text-dim: #8d9bb0;
    --accent: #34c78a;
    --accent-dim: rgba(52,199,138,0.16);
    --alert: #ff4632;
    --alert-dim: rgba(255,70,50,0.20);
    --warn: #ffb020;
  }

  *{ box-sizing: border-box; }
  html{ font-size: 22px; } /* base bump: everything below is sized in rem, so this scales the whole UI up */
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    user-select: none;
  }
  .display{ font-family: "Do Hyeon", "Noto Sans KR", sans-serif; }
  .mono{ font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  button{ font-family: inherit; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible{ outline: 3px solid var(--accent); outline-offset: 3px; }

  .screen{
    min-height: 100dvh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
    gap: 2.4rem;
    text-align: center;
  }

  /* ---------- role picker ---------- */
  .stack{ display: flex; flex-direction: column; gap: .6rem; align-items: center; }
  .role-title{ font-size: clamp(1.6rem, 4vw, 2.2rem); }
  .role-sub{ color: var(--text-dim); font-size: 1.05rem; }
  .role-grid{ display: flex; gap: 1.6rem; flex-wrap: wrap; justify-content: center; }
  .role-card{
    width: min(320px, 42vw);
    min-width: 260px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.4rem 1.8rem;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
    transition: border-color .15s, transform .15s, background .15s;
  }
  .role-card:hover{ border-color: var(--accent); transform: translateY(-2px); }
  .role-card:active{ transform: translateY(0); }
  .role-emoji{ font-size: 3rem; }
  .role-name{ font-family: "Do Hyeon", sans-serif; font-size: 1.4rem; }
  .role-desc{ color: var(--text-dim); font-size: 0.92rem; line-height: 1.5; }

  /* ---------- caller ---------- */
  .location-tag{
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: .8rem;
  }
  .caller-heading{ font-size: 1.5rem; }

  .teacher-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1rem;
    width: min(900px, 92vw);
  }
  .teacher-card{
    position: relative;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    padding: 1.4rem 0.8rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    min-height: 130px;
    transition: transform .12s ease, border-color .2s ease, background .2s ease;
  }
  .teacher-card:active{ transform: scale(0.96); }
  .teacher-name{ font-size: 1.15rem; font-weight: 700; }
  .teacher-status{ min-height: 1.1rem; font-size: .78rem; color: var(--text-dim); }
  .teacher-card[data-state="idle"]:hover{ border-color: var(--accent); }
  .teacher-card[data-state="waiting"]{
    border-color: var(--alert);
    background: var(--alert-dim);
    animation: waitPulse 1.4s ease-in-out infinite;
  }
  .teacher-card[data-state="waiting"] .teacher-status{ color: var(--alert); }
  @keyframes waitPulse{
    0%, 100% { box-shadow: 0 0 0 0 var(--alert-dim); }
    50% { box-shadow: 0 0 0 10px transparent; }
  }
  .teacher-card[data-state="acked"]{ border-color: var(--accent); background: var(--accent-dim); }
  .teacher-card[data-state="acked"] .teacher-status{ color: var(--accent); }
  .teacher-card[data-state="missed"]{ border-color: var(--warn); background: rgba(255,176,32,0.12); }
  .teacher-card[data-state="missed"] .teacher-status{ color: var(--warn); }
  .teacher-card[data-state="unavailable"]{ border-color: var(--warn); background: rgba(255,176,32,0.12); }
  .teacher-card[data-state="unavailable"] .teacher-status{ color: var(--warn); }
  .away-badge{
    position: absolute;
    top: .6rem;
    right: .6rem;
    font-size: .68rem;
    padding: .15rem .5rem;
    border-radius: 999px;
    background: var(--surface-raised);
    color: var(--warn);
    border: 1px solid var(--warn);
  }

  /* ---------- receiver: start gate ---------- */
  .start-btn{
    background: var(--accent);
    color: #08130e;
    font-family: "Do Hyeon", sans-serif;
    font-size: 1.3rem;
    padding: 1.1rem 2.4rem;
    border-radius: 999px;
  }

  /* ---------- receiver: idle ---------- */
  .idle-badge{
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 6px var(--accent-dim);
    display: inline-block;
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ opacity: .55; } 50%{ opacity: 1; } }
  .idle-row{ display: flex; align-items: center; gap: .7rem; }
  .idle-title{ font-family: "Do Hyeon", sans-serif; font-size: 1.6rem; }

  .history{
    width: min(560px, 90vw);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1rem 0;
    text-align: left;
  }
  .history-head{
    padding: 0 1.2rem .7rem;
    color: var(--text-dim);
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    border-bottom: 1px solid var(--border);
    margin-bottom: .3rem;
  }
  .history-empty{ padding: 1rem 1.2rem; color: var(--text-dim); font-size: .92rem; }
  .history-row{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: .8rem;
    padding: .55rem 1.2rem;
    font-size: .92rem;
  }
  .history-name{ color: var(--text); font-weight: 700; flex: 1; text-align: left; }
  .history-time{ color: var(--text-dim); }
  .history-latency{ color: var(--text-dim); }

  .away-row{
    display: flex;
    align-items: center;
    gap: .7rem;
    padding: .6rem 1.2rem;
    border-bottom: 1px solid var(--border);
  }
  .away-row:last-child{ border-bottom: none; }
  .away-name{ font-weight: 700; flex: 1; }
  .away-pill{
    font-size: .74rem;
    padding: .2rem .6rem;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .away-pill.is-away{ border-color: var(--warn); color: var(--warn); }
  .away-toggle{
    font-size: .82rem;
    padding: .5rem .9rem;
    border-radius: 8px;
    background: var(--surface-raised);
    color: var(--text);
  }
  .away-toggle:active{ transform: scale(0.96); }

  /* ---------- receiver: active alert ---------- */
  .alert-screen{
    min-height: 100dvh; width: 100%;
    background: radial-gradient(circle at 50% 40%, var(--alert-dim), var(--bg) 75%);
    animation: flash 1.1s ease-in-out infinite;
  }
  @keyframes flash{
    0%, 100% { background-color: var(--bg); }
    50% { background-color: #2a0e0a; }
  }
  .alert-icon{ font-size: 6rem; animation: ring 0.5s ease-in-out infinite; }
  @keyframes ring{
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-14deg); }
    75% { transform: rotate(14deg); }
  }
  .alert-title{ font-family: "Do Hyeon", sans-serif; font-size: clamp(2.2rem, 7vw, 3.4rem); color: var(--alert); }
  .alert-elapsed{ font-size: 1.3rem; color: var(--text-dim); }
  .alert-hint{ font-size: .82rem; color: var(--text-dim); opacity: .7; }
  .alert-actions{ display: flex; gap: .9rem; flex-wrap: wrap; justify-content: center; }
  .ack-btn{
    background: var(--text);
    color: #1a0705;
    font-family: "Do Hyeon", sans-serif;
    font-size: 1.5rem;
    padding: 1.3rem 3rem;
    border-radius: 999px;
  }
  .ack-btn:active{ transform: scale(0.97); }
  .unavailable-btn{
    background: transparent;
    color: var(--warn);
    border: 2px solid var(--warn);
    font-family: "Do Hyeon", sans-serif;
    font-size: 1.15rem;
    padding: 1.1rem 1.8rem;
    border-radius: 999px;
  }
  .unavailable-btn:active{ transform: scale(0.97); }

  /* ---------- shared ---------- */
  .toast{
    position: fixed;
    bottom: 8vh;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: .8rem 1.4rem;
    border-radius: 12px;
    font-size: .95rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  .reset-btn{
    position: fixed;
    bottom: 0.9rem;
    right: 1rem;
    background: transparent;
    color: var(--text-dim);
    font-size: .78rem;
    padding: .4rem .6rem;
    opacity: .45;
  }
  .reset-btn:hover{ opacity: .9; }

  .diag-btn{
    position: fixed;
    bottom: 0.9rem;
    left: 1rem;
    background: transparent;
    color: var(--text-dim);
    font-size: .78rem;
    padding: .4rem .6rem;
    opacity: .45;
  }
  .diag-btn:hover{ opacity: .9; }

  .diag-overlay{
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 12, 0.92);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;
  }
  .diag-panel{
    width: min(560px, 100%);
    max-height: 86vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 1.6rem;
    text-align: left;
  }
  .diag-panel h2{ margin: 0 0 1rem; font-family: "Do Hyeon", sans-serif; font-size: 1.3rem; font-weight: normal; }
  .diag-row{ display: flex; justify-content: space-between; gap: 1rem; padding: .5rem 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  .diag-row:last-of-type{ border-bottom: none; }
  .diag-label{ color: var(--text-dim); flex-shrink: 0; white-space: nowrap; }
  .diag-value{ text-align: right; font-weight: 700; word-break: break-word; }
  .diag-value.bad{ color: var(--alert); }
  .diag-value.good{ color: var(--accent); }
  .diag-voices{ margin-top: .8rem; padding: .8rem; background: var(--surface-raised); border-radius: 10px; font-size: .82rem; color: var(--text-dim); max-height: 140px; overflow-y: auto; }
  .diag-voices div{ padding: .15rem 0; }
  .diag-actions{ display: flex; gap: .7rem; margin-top: 1.2rem; flex-wrap: wrap; }
  .diag-actions button{
    flex: 1;
    min-width: 120px;
    background: var(--accent);
    color: #08130e;
    font-weight: 700;
    padding: .8rem 1rem;
    border-radius: 10px;
    font-size: .92rem;
  }
  .diag-actions button.secondary{ background: var(--surface-raised); color: var(--text); }
  .diag-close{ width: 100%; margin-top: .7rem; background: transparent; color: var(--text-dim); padding: .6rem; }

  .conn-pill{
    position: fixed;
    top: 0.8rem;
    left: 0.9rem;
    display: flex;
    align-items: center;
    gap: .45rem;
    font-size: .74rem;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: .35rem .7rem;
    border-radius: 999px;
    opacity: .8;
  }
  .conn-dot{ width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
  .conn-pill[data-status="online"] .conn-dot{ background: var(--accent); }
  .conn-pill[data-status="offline"] .conn-dot{ background: var(--alert); }
  .conn-pill[data-status="connecting"] .conn-dot{ animation: breathe 1.4s ease-in-out infinite; }

  [hidden]{ display: none !important; }

  @media (prefers-reduced-motion: reduce){
    .idle-badge, .alert-screen, .alert-icon, .teacher-card[data-state="waiting"], .conn-dot{ animation: none !important; }
  }
</style>
</head>
<body>

<div id="screen-role" class="screen">
  <div class="stack">
    <div class="role-title display">이 태블릿의 역할을 선택하세요</div>
    <div class="role-sub">한 번만 설정하면 다음부터 자동으로 기억해요</div>
  </div>
  <div class="role-grid">
    <button class="role-card" data-role="caller">
      <div class="role-emoji">🔔</div>
      <div class="role-name">호출 버튼</div>
      <div class="role-desc">교무실 밖에 두는 태블릿<br>눌러서 선생님을 호출해요</div>
    </button>
    <button class="role-card" data-role="receiver">
      <div class="role-emoji">📟</div>
      <div class="role-name">수신 태블릿</div>
      <div class="role-desc">교무실 안에 두는 태블릿<br>호출이 오면 알려줘요</div>
    </button>
  </div>
</div>

<div id="screen-caller" class="screen" hidden>
  <div class="stack">
    <div class="location-tag">교무실 호출</div>
    <div class="caller-heading display">선생님을 선택하세요</div>
  </div>
  <div id="teacher-grid" class="teacher-grid"></div>
</div>

<div id="unavailable-overlay" class="diag-overlay" hidden>
  <div class="diag-panel" style="text-align: center;">
    <div style="font-size: 3.4rem;">🙅</div>
    <h2 id="unavailable-text" class="display" style="margin-top: .8rem;"></h2>
    <div class="role-sub" style="margin-bottom: 1.2rem;">잠시 후 다시 호출해보세요</div>
    <button id="unavailable-dismiss" class="start-btn" style="width: 100%;">확인</button>
  </div>
</div>

<div id="screen-receiver-start" class="screen" hidden>
  <div class="stack">
    <div class="idle-title display">수신 태블릿 준비</div>
    <div class="role-sub">시작하면 소리·음성·화면 켜짐 알림이 활성화돼요</div>
  </div>
  <button id="start-btn" class="start-btn">🔔 모니터링 시작</button>
</div>

<div id="screen-receiver-idle" class="screen" hidden>
  <div class="idle-row">
    <span class="idle-badge"></span>
    <span class="idle-title display">대기 중</span>
  </div>
  <div class="history">
    <div class="history-head">선생님 재실 상태</div>
    <div id="away-list" class="away-list"></div>
  </div>
  <div class="history">
    <div class="history-head">오늘 호출 기록</div>
    <div id="history-list"></div>
  </div>
</div>

<div id="screen-receiver-alert" class="screen alert-screen" hidden>
  <span class="alert-icon">🔔</span>
  <div id="alert-title" class="alert-title">호출입니다!</div>
  <div class="alert-elapsed mono"><span id="alert-elapsed">0초</span> 전</div>
  <div class="alert-actions">
    <button id="ack-btn" class="ack-btn">확인했어요</button>
    <button id="unavailable-btn" class="unavailable-btn">🙅 안계십니다</button>
  </div>
  <div class="alert-hint">30초 안에 확인하지 않으면 자동으로 미확인 처리돼요</div>
</div>

<div id="conn-pill" class="conn-pill" data-status="connecting" hidden>
  <span class="conn-dot"></span>
  <span id="conn-label">연결 중…</span>
</div>
<div id="toast" class="toast"></div>
<button id="reset-btn" class="reset-btn" hidden>기기 설정 초기화</button>
<button id="diag-btn" class="diag-btn" hidden>🔧 음성 진단</button>

<div id="diag-overlay" class="diag-overlay" hidden>
  <div class="diag-panel">
    <h2 class="display">🔧 음성 진단</h2>
    <div class="diag-row"><span class="diag-label">브라우저</span><span id="diag-ua" class="diag-value" style="font-weight:400; font-size:.78rem;"></span></div>
    <div class="diag-row"><span class="diag-label">음성 합성 지원</span><span id="diag-support" class="diag-value"></span></div>
    <div class="diag-row"><span class="diag-label">감지된 음성 수</span><span id="diag-count" class="diag-value"></span></div>
    <div class="diag-row"><span class="diag-label">한국어 음성</span><span id="diag-ko" class="diag-value"></span></div>
    <div id="diag-voices" class="diag-voices"></div>
    <div class="diag-actions">
      <button id="diag-refresh" class="secondary">🔄 다시 검사</button>
      <button id="diag-test">▶️ 테스트 재생</button>
    </div>
    <button id="diag-close" class="diag-close">닫기</button>
  </div>
</div>

<script>
(function () {
  var ROLE_KEY = "callBellRole";
  var LOCAL_LOCK_MS = 1500;
  var ACKED_DISPLAY_MS = 4000;
  var HISTORY_KEEP = 50;
  var AUTO_EXPIRE_MS = 30000;
  // Public pub/sub channel (ntfy.sh) — long random name so nobody can guess it.
  var NTFY_TOPIC = "gyomusil-hobul-706c5e98ed0185566eb27ff052cd3fbf";
  var NTFY_BASE = "https://ntfy.sh/" + NTFY_TOPIC;
  var TEACHERS = [
    "송택수", "박예은", "최인선", "김보선", "허수빈",
    "강지현", "황선영", "김민진", "백효안", "이재석"
  ];

  var screens = {
    role: document.getElementById("screen-role"),
    caller: document.getElementById("screen-caller"),
    receiverStart: document.getElementById("screen-receiver-start"),
    receiverIdle: document.getElementById("screen-receiver-idle"),
    receiverAlert: document.getElementById("screen-receiver-alert"),
  };

  function showScreen(name) {
    Object.keys(screens).forEach(function (key) {
      screens[key].hidden = key !== name;
    });
  }

  function showToast(text) {
    var toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }

  function setConnStatus(status) {
    var pill = document.getElementById("conn-pill");
    pill.hidden = false;
    pill.setAttribute("data-status", status);
    document.getElementById("conn-label").textContent =
      status === "online" ? "연결됨" : status === "offline" ? "재연결 중…" : "연결 중…";
  }

  function getRole() {
    try { return localStorage.getItem(ROLE_KEY); } catch (e) { return null; }
  }
  function setRole(role) {
    try { localStorage.setItem(ROLE_KEY, role); } catch (e) {}
  }

  var resetBtn = document.getElementById("reset-btn");
  resetBtn.hidden = false;
  resetBtn.addEventListener("click", function () {
    try { localStorage.removeItem(ROLE_KEY); } catch (e) {}
    location.reload();
  });

  // ---- voice diagnostics panel (for debugging silent TTS on a device) ----
  var diagBtn = document.getElementById("diag-btn");
  var diagOverlay = document.getElementById("diag-overlay");
  diagBtn.hidden = false;
  function runDiagnostics() {
    var supported = "speechSynthesis" in window;
    document.getElementById("diag-ua").textContent = navigator.userAgent;
    var supportEl = document.getElementById("diag-support");
    supportEl.textContent = supported ? "지원됨" : "지원 안 됨";
    supportEl.className = "diag-value " + (supported ? "good" : "bad");

    var voices = supported ? speechSynthesis.getVoices() : [];
    var countEl = document.getElementById("diag-count");
    countEl.textContent = voices.length + "개";
    countEl.className = "diag-value " + (voices.length > 0 ? "good" : "bad");

    var hasKo = voices.some(function (v) { return v.lang && v.lang.indexOf("ko") === 0; });
    var koEl = document.getElementById("diag-ko");
    koEl.textContent = hasKo ? "있음" : "없음";
    koEl.className = "diag-value " + (hasKo ? "good" : "bad");

    var list = document.getElementById("diag-voices");
    list.innerHTML = voices.length === 0
      ? "이 기기에서 사용 가능한 음성이 하나도 없어요."
      : voices.map(function (v) { return "<div>" + v.name + " — " + v.lang + "</div>"; }).join("");
  }
  diagBtn.addEventListener("click", function () {
    diagOverlay.hidden = false;
    runDiagnostics();
    setTimeout(runDiagnostics, 600); // voice list can load asynchronously
  });
  document.getElementById("diag-close").addEventListener("click", function () {
    diagOverlay.hidden = true;
  });
  document.getElementById("diag-refresh").addEventListener("click", runDiagnostics);
  document.getElementById("diag-test").addEventListener("click", function () {
    speak("테스트, 하나 둘 셋");
  });

  var wakeLock = null;
  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (e) { /* ignore: not supported, or no secure context */ }
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") requestWakeLock();
  });

  // ---- unicode-safe base64 (ntfy bodies must not start with "{" or they get
  // treated as a JSON file attachment instead of a plain message) ----
  function b64Encode(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function (_, hex) {
      return String.fromCharCode("0x" + hex);
    }));
  }
  function b64Decode(str) {
    return decodeURIComponent(atob(str).split("").map(function (c) {
      return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(""));
  }

  function publish(payload) {
    return fetch(NTFY_BASE, { method: "POST", body: b64Encode(JSON.stringify(payload)) });
  }

  // `next` receives each event payload in order (oldest first, then live).
  function subscribe(next) {
    var es = new EventSource(NTFY_BASE + "/sse?since=12h");
    es.onopen = function () { setConnStatus("online"); };
    es.onerror = function () { setConnStatus("offline"); };
    es.onmessage = function (e) {
      var frame;
      try { frame = JSON.parse(e.data); } catch (err) { return; }
      if (frame.event !== "message" || !frame.message) return;
      var payload;
      try { payload = JSON.parse(b64Decode(frame.message)); } catch (err) { return; }
      next(payload);
    };
    return es;
  }

  // ---- alert tone (unlocked by an explicit tap) ----
  var audioCtx = null;
  function unlockAudio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }
  function playChime() {
    if (!audioCtx) return;
    try {
      [880, 1320].forEach(function (freq, i) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        var start = audioCtx.currentTime + i * 0.14;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.35, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.32);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.34);
      });
    } catch (e) {}
  }

  // ---- text-to-speech announcement ----
  var koVoice = null;
  // Keep a module-level reference to the in-flight utterance: some browsers
  // silently drop speech if the SpeechSynthesisUtterance gets garbage
  // collected before it finishes (it's only weakly referenced internally).
  var activeUtterance = null;
  function pickVoice() {
    try {
      var voices = speechSynthesis.getVoices();
      koVoice = voices.find(function (v) { return v.lang === "ko-KR"; }) ||
                voices.find(function (v) { return v.lang && v.lang.indexOf("ko") === 0; }) ||
                null;
    } catch (e) {}
  }
  if ("speechSynthesis" in window) {
    speechSynthesis.onvoiceschanged = pickVoice;
    pickVoice();
  }
  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR";
      if (koVoice) u.voice = koVoice;
      u.rate = 0.95;
      activeUtterance = u;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function unlockSpeech() {
    speak("호출 준비 완료");
  }
  function speakTeacher(name) {
    speak(name + " 선생님");
  }

  function formatClock(ts) {
    var d = new Date(ts);
    var h = d.getHours();
    var ampm = h < 12 ? "오전" : "오후";
    var h12 = h % 12 === 0 ? 12 : h % 12;
    var m = String(d.getMinutes()).padStart(2, "0");
    return ampm + " " + h12 + ":" + m;
  }

  // shared in-memory store of recent calls, keyed by call id
  var callStore = {};
  // latest away/present status per teacher name, e.g. { "김민진": { away: true, at: 169... } }
  var awayState = {};
  function applyEvent(payload) {
    if (!payload || !payload.type) return;
    if (payload.type === "away") {
      awayState[payload.teacher] = { away: !!payload.away, at: payload.at };
      return;
    }
    if (!payload.id) return;
    if (payload.type === "call") {
      callStore[payload.id] = {
        id: payload.id, teacher: payload.teacher,
        calledAt: payload.calledAt, acknowledged: false, acknowledgedAt: null
      };
    } else if (payload.type === "ack") {
      var existing = callStore[payload.id];
      if (existing) {
        existing.acknowledged = true;
        existing.acknowledgedAt = payload.acknowledgedAt;
        existing.missed = !!payload.missed;
        existing.unavailable = !!payload.unavailable;
      } else {
        callStore[payload.id] = {
          id: payload.id, teacher: payload.teacher, calledAt: payload.calledAt,
          acknowledged: true, acknowledgedAt: payload.acknowledgedAt,
          missed: !!payload.missed, unavailable: !!payload.unavailable
        };
      }
    }
    var ids = Object.keys(callStore);
    if (ids.length > HISTORY_KEEP) {
      ids.sort(function (a, b) { return callStore[b].calledAt - callStore[a].calledAt; });
      ids.slice(HISTORY_KEEP).forEach(function (id) { delete callStore[id]; });
    }
  }

  var role = getRole();
  if (role === "caller") startCaller();
  else if (role === "receiver") startReceiverGate();
  else showScreen("role");

  document.querySelectorAll(".role-card").forEach(function (card) {
    card.addEventListener("click", function () {
      var chosen = card.getAttribute("data-role");
      setRole(chosen);
      if (chosen === "caller") startCaller();
      else startReceiverGate();
    });
  });

  // ================= CALLER =================
  function startCaller() {
    showScreen("caller");
    requestWakeLock();

    var grid = document.getElementById("teacher-grid");
    var localLockUntil = {};
    var poppedUnavailable = {};
    var callerAudioUnlocked = false;

    function showUnavailablePopup(doc) {
      document.getElementById("unavailable-text").textContent = doc.teacher + " 선생님은 지금 안 계세요";
      document.getElementById("unavailable-overlay").hidden = false;
      playChime();
      speak(doc.teacher + " 선생님은 지금 자리에 안 계세요");
    }
    document.getElementById("unavailable-dismiss").addEventListener("click", function () {
      document.getElementById("unavailable-overlay").hidden = true;
    });

    grid.innerHTML = TEACHERS.map(function (name) {
      return '<button class="teacher-card" data-state="idle" data-name="' + name + '">' +
        '<span class="away-badge" hidden>부재중</span>' +
        '<span class="teacher-name">' + name + '</span>' +
        '<span class="teacher-status"></span>' +
        '</button>';
    }).join("");

    function latestFor(name) {
      var latest = null;
      Object.keys(callStore).forEach(function (id) {
        var c = callStore[id];
        if (c.teacher === name && (!latest || c.calledAt > latest.calledAt)) latest = c;
      });
      return latest;
    }

    function render() {
      var now = Date.now();
      grid.querySelectorAll(".teacher-card").forEach(function (card) {
        var name = card.getAttribute("data-name");
        var doc = latestFor(name);
        var statusEl = card.querySelector(".teacher-status");
        card.querySelector(".away-badge").hidden = !(awayState[name] && awayState[name].away);
        if (doc && doc.acknowledged && doc.unavailable && !poppedUnavailable[doc.id]) {
          poppedUnavailable[doc.id] = true;
          showUnavailablePopup(doc);
        }
        if (doc && !doc.acknowledged) {
          card.setAttribute("data-state", "waiting");
          var secs = Math.max(0, Math.floor((now - doc.calledAt) / 1000));
          statusEl.textContent = "호출 중… " + secs + "초";
        } else if (doc && doc.acknowledged && doc.unavailable && now - doc.acknowledgedAt < ACKED_DISPLAY_MS) {
          card.setAttribute("data-state", "unavailable");
          statusEl.textContent = "지금 안 계세요 🙅";
        } else if (doc && doc.acknowledged && doc.missed && now - doc.acknowledgedAt < ACKED_DISPLAY_MS) {
          card.setAttribute("data-state", "missed");
          statusEl.textContent = "응답이 없었어요 (미확인)";
        } else if (doc && doc.acknowledged && now - doc.acknowledgedAt < ACKED_DISPLAY_MS) {
          card.setAttribute("data-state", "acked");
          statusEl.textContent = "확인했어요 ✅";
        } else if (localLockUntil[name] && now < localLockUntil[name]) {
          card.setAttribute("data-state", "waiting");
          statusEl.textContent = "호출했습니다 🔔";
        } else {
          card.setAttribute("data-state", "idle");
          statusEl.textContent = "";
        }
      });
    }

    setInterval(render, 1000);
    subscribe(function (payload) { applyEvent(payload); render(); });

    grid.addEventListener("click", function (e) {
      var card = e.target.closest(".teacher-card");
      if (!card) return;
      if (!callerAudioUnlocked) {
        callerAudioUnlocked = true;
        unlockAudio();
        try {
          var warm = new SpeechSynthesisUtterance(" ");
          warm.volume = 0;
          speechSynthesis.speak(warm);
        } catch (e) {}
      }
      var name = card.getAttribute("data-name");
      var now = Date.now();

      // Away teachers never get called: just tell the student locally, no trip to the office.
      if (awayState[name] && awayState[name].away) {
        if (localLockUntil[name] && now < localLockUntil[name]) return;
        localLockUntil[name] = now + LOCAL_LOCK_MS;
        showUnavailablePopup({ teacher: name });
        return;
      }

      if (card.getAttribute("data-state") === "waiting" || (localLockUntil[name] && now < localLockUntil[name])) return;
      localLockUntil[name] = now + LOCAL_LOCK_MS;
      render();
      showToast(name + " 선생님을 호출했습니다 🔔");
      var id = now.toString(36) + Math.random().toString(36).slice(2, 8);
      publish({ type: "call", id: id, teacher: name, calledAt: now }).catch(function () {
        showToast("호출 전송에 실패했어요. 다시 눌러주세요.");
        localLockUntil[name] = 0;
        render();
      });
    });
  }

  // ================= RECEIVER =================
  function startReceiverGate() {
    showScreen("receiverStart");
    document.getElementById("start-btn").addEventListener("click", function () {
      unlockAudio();
      unlockSpeech();
      requestWakeLock();
      startReceiver();
    }, { once: true });
  }

  function startReceiver() {
    var elapsedTimer = null;
    var expireTimer = null;
    var currentActiveId = null;

    function renderAwayList() {
      var list = document.getElementById("away-list");
      list.innerHTML = TEACHERS.map(function (name) {
        var away = !!(awayState[name] && awayState[name].away);
        return '<div class="away-row">' +
          '<span class="away-name">' + name + '</span>' +
          '<span class="away-pill' + (away ? ' is-away' : '') + '">' + (away ? "부재중" : "자리에 있음") + '</span>' +
          '<button class="away-toggle" data-name="' + name + '" data-away="' + away + '">' +
          (away ? "돌아왔어요" : "외출") +
          '</button>' +
          '</div>';
      }).join("");
    }
    document.getElementById("away-list").addEventListener("click", function (e) {
      var btn = e.target.closest(".away-toggle");
      if (!btn) return;
      var name = btn.getAttribute("data-name");
      var goingAway = btn.getAttribute("data-away") !== "true";
      var now = Date.now();
      awayState[name] = { away: goingAway, at: now };
      renderAwayList();
      publish({ type: "away", teacher: name, away: goingAway, at: now });
    });

    function renderIdle() {
      showScreen("receiverIdle");
      renderAwayList();
      var list = document.getElementById("history-list");
      var acked = Object.keys(callStore).map(function (id) { return callStore[id]; })
        .filter(function (d) { return d.acknowledged; })
        .sort(function (a, b) { return b.calledAt - a.calledAt; })
        .slice(0, 6);
      if (acked.length === 0) {
        list.innerHTML = '<div class="history-empty">아직 기록이 없어요</div>';
        return;
      }
      list.innerHTML = acked.map(function (d) {
        var latencyHtml;
        if (d.unavailable) {
          latencyHtml = '<span class="history-latency" style="color:var(--warn);">🙅 안 계심으로 응답</span>';
        } else if (d.missed) {
          latencyHtml = '<span class="history-latency" style="color:var(--warn);">미확인 (30초 초과)</span>';
        } else {
          var latency = Math.max(0, Math.round((d.acknowledgedAt - d.calledAt) / 1000));
          latencyHtml = '<span class="history-latency">' + latency + '초 만에 확인</span>';
        }
        return '<div class="history-row">' +
          '<span class="history-name">' + d.teacher + '</span>' +
          '<span class="history-time mono">' + formatClock(d.calledAt) + '</span>' +
          latencyHtml +
          '</div>';
      }).join("");
    }

    function renderAlert(active) {
      showScreen("receiverAlert");
      var titleEl = document.getElementById("alert-title");
      var elapsedEl = document.getElementById("alert-elapsed");
      titleEl.textContent = active.teacher + " 선생님 호출입니다!";
      function tick() {
        var secs = Math.max(0, Math.floor((Date.now() - active.calledAt) / 1000));
        var m = Math.floor(secs / 60), s = secs % 60;
        elapsedEl.textContent = m > 0 ? (m + "분 " + s + "초") : (s + "초");
      }
      tick();
      clearInterval(elapsedTimer);
      elapsedTimer = setInterval(tick, 1000);

      if (currentActiveId !== active.id) {
        currentActiveId = active.id;
        try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
        // Announce the name once, then stay silent (screen stays up until acknowledged).
        playChime();
        speakTeacher(active.teacher);

        // Not answered within AUTO_EXPIRE_MS: stop ringing, mark missed, move on
        // so a stuck call doesn't block/overlap alerts for other teachers.
        clearTimeout(expireTimer);
        expireTimer = setTimeout(function () { ackCall(active, { missed: true }); }, AUTO_EXPIRE_MS);
      }

      document.getElementById("ack-btn").onclick = function () { ackCall(active, {}); };
      document.getElementById("unavailable-btn").onclick = function () { ackCall(active, { unavailable: true }); };
    }

    function ackCall(active, opts) {
      clearTimeout(expireTimer);
      clearInterval(elapsedTimer);
      currentActiveId = null;
      try { speechSynthesis.cancel(); } catch (e) {}
      var now = Date.now();
      active.acknowledged = true;
      active.acknowledgedAt = now;
      active.missed = !!opts.missed;
      active.unavailable = !!opts.unavailable;
      publish({
        type: "ack", id: active.id, teacher: active.teacher, calledAt: active.calledAt,
        acknowledgedAt: now, missed: !!opts.missed, unavailable: !!opts.unavailable
      });
      renderFromStore();
    }

    function renderFromStore() {
      var pending = Object.keys(callStore).map(function (id) { return callStore[id]; })
        .filter(function (d) { return !d.acknowledged; })
        .sort(function (a, b) { return a.calledAt - b.calledAt; });

      if (pending.length > 0) {
        renderAlert(pending[0]);
      } else {
        clearTimeout(expireTimer);
        clearInterval(elapsedTimer);
        currentActiveId = null;
        renderIdle();
      }
    }

    renderIdle();
    subscribe(function (payload) { applyEvent(payload); renderFromStore(); });
  }
})();
</script>
</body>
</html>
